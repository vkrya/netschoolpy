[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netschoolpy"
version = "8.0.1"
description = "Асинхронный клиент для «Сетевого города» с поддержкой ЕСИА/Госуслуг, Pydantic v2, SignalR и CLI"
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.10"
authors = [
    { name = "vkrya" },
]
keywords = [
    "netschool", "netschoolpy", "sgo",
    "сетевой город", "дневник", "госуслуги", "esia",
    "education", "api", "web Education", "ir-tech",
    "электронный журнал", "school", "web2edu", "region",
    "pydantic", "signalr"
]
classifiers = [
    "Natural Language :: Russian",
    "Topic :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.23",
    "pydantic>=2.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
qr = ["qrcode>=7.0"]
ical = ["icalendar>=5.0.0"]
cli = ["rich>=13.0.0", "typer>=0.9.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.4",
    "mypy>=1.0",
]

[project.urls]
Source = "https://github.com/vkrya/netschoolpy"
Issues = "https://github.com/vkrya/netschoolpy/issues"
Documentation = "https://github.com/vkrya/netschoolpy/tree/main/docs"

[project.scripts]
netschoolpy = "netschoolpy.cli:main"

[tool.setuptools.packages.find]
include = ["netschoolpy*"]

[tool.setuptools.package-data]
netschoolpy = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
